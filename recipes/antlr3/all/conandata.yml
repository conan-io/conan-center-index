patches:
  "3.5.3":
    - patch_file: "patches/0006-antlr3memory.hpp-fix-for-C-20-mode.patch"
      patch_description: "Use const key type in map allocators, required in C++20 mode"
      patch_type: "portability"
      patch_source: "https://github.com/scylladb/scylladb/blob/5baf16005fd07091235ee6e9bf21eb5fb086e492/tools/antlr3-patches/0006-antlr3memory.hpp-fix-for-C-20-mode.patch"
    - patch_file: "patches/0008-unconst-cyclicdfa-gcc-14.patch"
      patch_description: "Drop const from CyclicDFA members so it stays copy-assignable with gcc >= 14"
      patch_type: "portability"
      patch_source: "https://github.com/scylladb/scylladb/blob/5baf16005fd07091235ee6e9bf21eb5fb086e492/tools/antlr3-patches/0008-unconst-cyclicdfa-gcc-14.patch"
