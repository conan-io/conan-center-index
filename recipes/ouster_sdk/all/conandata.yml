sources:
  "1.0.1":
    url: "https://github.com/ouster-lidar/ouster-sdk/archive/refs/tags/v1.0.1.tar.gz"
    sha256: "b40b5a54f551d80d2027e7b3c5662cf2e3ec9e5668e2d5a31c7510aae13b97b3"
patches:
  "1.0.1":
    - patch_file: "patches/001-1.0.1-unvendor-robin-map.patch"
      patch_type: "conan"
      patch_description: "Use Conan tsl-robin-map instead of the vendored copy"
    - patch_file: "patches/002-1.0.1-use-conan-openssl.patch"
      patch_type: "conan"
      patch_description: "Link the OpenSSL::Crypto target instead of the OPENSSL_LIBRARIES variable"
    - patch_file: "patches/003-1.0.1-unvendor-glad.patch"
      patch_type: "conan"
      patch_description: "Use Conan glad instead of the vendored copy"
    - patch_file: "patches/004-1.0.1-unvendor-sophus.patch"
      patch_type: "conan"
      patch_description: "Use Conan Sophus instead of the vendored copy"
    - patch_file: "patches/005-1.0.1-use-conan-zstd.patch"
      patch_type: "conan"
      patch_description: "Link the zstd::libzstd target provided by Conan in zpng and ouster_osf"
    - patch_file: "patches/006-1.0.1-shared-library-optional-sensor.patch"
      patch_type: "bugfix"
      patch_description: "Do not reference the ouster_sensor target in shared_library when BUILD_SENSOR is OFF"
